<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>comeback.mjg Focus Shield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #ffffff; color: #0f172a; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-icon { width: 24px; height: 24px; background: #ea580c; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 13px; }
    .brand-title { font-size: 14px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; }
    .brand-sub { font-size: 10px; color: #64748b; font-weight: 600; text-transform: uppercase; }
    
    .status-card { border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; padding: 14px; margin-bottom: 14px; }
    .status-card.active { background: #fff7ed; border-color: #fdba74; }
    .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .status-label { font-weight: 700; font-size: 13px; }
    .badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 9999px; }
    .badge-on { background: #ea580c; color: #ffffff; }
    .badge-off { background: #e2e8f0; color: #64748b; }

    .switch-btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-engage { background: #ea580c; color: white; }
    .btn-engage:hover { background: #c2410c; }
    .btn-disengage { background: #ffffff; color: #b91c1c; border: 1px solid #fecaca; }
    .btn-disengage:hover { background: #fef2f2; }

    .presets { display: flex; gap: 6px; margin-top: 10px; }
    .preset-pill { flex: 1; padding: 5px; font-size: 11px; font-weight: 600; text-align: center; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; }
    .preset-pill:hover { border-color: #ea580c; color: #ea580c; }
    .preset-pill.active { background: #ea580c; color: white; border-color: #ea580c; }

    .section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .domain-list { max-height: 120px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; background: white; margin-bottom: 8px; }
    .domain-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
    .domain-item:last-child { border-bottom: none; }
    .del-btn { color: #94a3b8; cursor: pointer; font-weight: bold; padding: 0 4px; border: none; background: none; }
    .del-btn:hover { color: #ef4444; }

    .add-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .add-input { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; }
    .add-input:focus { outline: none; border-color: #ea580c; }
    .add-btn { padding: 6px 12px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .add-btn:hover { background: #e2e8f0; }

    .footer { text-align: center; border-top: 1px solid #e2e8f0; padding-top: 10px; }
    .footer a { color: #ea580c; text-decoration: none; font-weight: 700; font-size: 12px; display: block; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">comeback.mjg</div>
        <div class="brand-sub">Desktop Focus Shield</div>
      </div>
    </div>
    <span id="badgeStatus" class="badge badge-off">IDLE</span>
  </div>

  <div id="statusCard" class="status-card">
    <div class="status-row">
      <span class="status-label" id="statusTitle">Distraction Shield: OFF</span>
      <span id="timerText" style="font-size: 11px; font-weight: 700; color: #ea580c;"></span>
    </div>
    <button id="toggleBtn" class="switch-btn btn-engage">Engage 45m Focus Block</button>
    <div class="presets">
      <div class="preset-pill" data-min="25">25m Sprint</div>
      <div class="preset-pill active" data-min="45">45m Block</div>
      <div class="preset-pill" data-min="90">90m Deep</div>
    </div>
  </div>

  <div class="section-title">
    <span>Blacklisted Sites</span>
    <span id="domainCount" style="font-size: 10px; color: #ea580c;">9 Sites</span>
  </div>

  <div id="domainList" class="domain-list"></div>

  <div class="add-row">
    <input type="text" id="domainInput" class="add-input" placeholder="e.g. news.ycombinator.com">
    <button id="addDomainBtn" class="add-btn">+ Add</button>
  </div>

  <div class="footer">
    <a href="https://ptos-exec-89214.web.app" target="_blank">Open comeback.mjg Operating System ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
